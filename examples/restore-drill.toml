version = 1
attestation_ttl_days = 30

[drill]
name = "local-smoke-drill"

[target]
id = "local-restore-drill"
isolated = true

[commands]
prepare = "mkdir -p /tmp/restore-drill-attestor-example"
restore = "printf 'restored' > /tmp/restore-drill-attestor-example/state"
cleanup = "rm -f /tmp/restore-drill-attestor-example/state && rmdir /tmp/restore-drill-attestor-example"
timeout_seconds = 10

[[checks]]
name = "one logical record restored"
kind = "row_count"
command = "printf '1\\n'"
min = 1
max = 1
timeout_seconds = 10

[[checks]]
name = "expected schema marker exists"
kind = "schema"
command = "printf 'schema-v1\\n'"
contains = "schema-v1"
timeout_seconds = 10

[[checks]]
name = "restored application state is readable"
kind = "application"
command = "test -r /tmp/restore-drill-attestor-example/state"
timeout_seconds = 10
